<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Préparons votre séance - Henzo Studio</title>
<meta name="theme-color" content="#030b0a">
<link rel="icon" href="icon-192.png">
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<script src="https://cdn.jsdelivr.net/npm/@supabase/supabase-js@2"></script>
<style>
:root{--bg:#030b0a;--card:#0a1c1a;--card2:#0f2a27;--line:#173b37;--txt:#fff;--muted:#9cbdb8;--accent:#48A89A;--light:#CBEFEB;--deep:#00524D;--pink:#ff6b8b;--violet:#7c6cff}
*{box-sizing:border-box;margin:0;padding:0}
body{font-family:Inter,system-ui,sans-serif;color:var(--txt);background:radial-gradient(1000px 500px at 85% -10%,rgba(72,168,154,.25),transparent 60%),var(--bg);min-height:100vh;padding-bottom:110px}
.wrap{max-width:900px;margin:0 auto;padding:24px 14px}
.brand{font-size:12px;letter-spacing:.3em;text-transform:uppercase;color:var(--light);opacity:.8}
h1{font-size:27px;font-weight:800;line-height:1.15;margin:8px 0 6px}
.intro{color:var(--muted);font-size:15px;line-height:1.55}
.steps{position:sticky;top:0;z-index:20;display:flex;gap:6px;margin:18px -14px 14px;padding:10px 14px;background:rgba(3,11,10,.92);backdrop-filter:blur(12px);border-bottom:1px solid var(--line)}
.steps button{flex:1;display:flex;flex-direction:column;align-items:center;gap:2px;border:1px solid var(--line);background:var(--card);color:var(--muted);border-radius:14px;padding:8px 4px;font:600 12px Inter,sans-serif;cursor:pointer}
.steps button b{font-size:15px;color:var(--txt)}
.steps button.on{border-color:var(--accent);color:var(--light);background:linear-gradient(160deg,rgba(0,82,77,.6),var(--card))}
h2{font-size:19px;font-weight:700;margin:6px 0 4px}
.sub{font-size:14px;color:var(--muted);line-height:1.5;margin-bottom:14px}
.grid{columns:2;column-gap:10px}
@media(min-width:700px){.grid{columns:3}}
.t{position:relative;break-inside:avoid;margin-bottom:10px;border-radius:16px;overflow:hidden;border:2px solid transparent;background:var(--card)}
.t img.ph{display:block;width:100%;height:auto;cursor:zoom-in}
.t.on{border-color:var(--pink)}
.t.mine{border-color:var(--violet)}
.h{position:absolute;top:8px;right:8px;width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:rgba(0,0,0,.45);backdrop-filter:blur(6px);border:0;cursor:pointer}
.h svg{width:21px;height:21px;fill:none;stroke:#fff;stroke-width:2}
.t.on .h{background:var(--pink)}.t.on .h svg{fill:#fff}
.x{position:absolute;top:8px;right:8px;width:34px;height:34px;border-radius:50%;border:0;background:rgba(0,0,0,.55);color:#fff;font-size:18px;cursor:pointer}
.tb{padding:8px;border-top:1px solid var(--line);background:var(--card)}
.tb input{width:100%;border:0;background:var(--card2);color:var(--txt);font:inherit;font-size:13px;padding:9px 10px;border-radius:10px;outline:none}
.var{display:block;width:100%;margin-top:6px;border:1px dashed var(--violet);background:none;color:#c9c2ff;font:600 12px Inter,sans-serif;padding:8px;border-radius:10px;cursor:pointer}
.ref{display:flex;align-items:center;gap:6px;font-size:11px;color:var(--muted);padding:6px 8px 0}
.ref img{width:28px;height:28px;object-fit:cover;border-radius:6px}
.drop{display:flex;flex-direction:column;align-items:center;gap:8px;padding:26px 16px;border:2px dashed var(--line);border-radius:20px;background:var(--card);text-align:center;cursor:pointer;margin-bottom:14px}
.drop b{font-size:16px}.drop span{font-size:13px;color:var(--muted)}
.drop .ic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;background:rgba(124,108,255,.18);color:#c9c2ff}
.prog{font-size:13px;color:var(--light);margin:-6px 0 12px;min-height:18px}
label{display:block;font-size:13px;color:var(--muted);margin:14px 0 6px}
input.f,textarea{width:100%;background:var(--card);border:1px solid var(--line);border-radius:14px;color:var(--txt);font:inherit;font-size:15px;padding:13px 14px;outline:none}
.sum{display:grid;grid-template-columns:1fr 1fr;gap:10px;margin:6px 0 4px}
.sum div{padding:14px;border-radius:16px;background:var(--card);border:1px solid var(--line)}
.sum b{display:block;font-size:24px}.sum span{font-size:12px;color:var(--muted)}
.mini{display:flex;gap:6px;overflow-x:auto;margin-top:10px;padding-bottom:4px}
.mini img{width:58px;height:58px;object-fit:cover;border-radius:10px;flex-shrink:0;border:2px solid var(--pink)}
.mini img.v{border-color:var(--violet)}
.bar{position:fixed;left:0;right:0;bottom:0;z-index:30;padding:12px 16px calc(12px + env(safe-area-inset-bottom));background:rgba(3,11,10,.95);backdrop-filter:blur(14px);border-top:1px solid var(--line)}
.bar-in{max-width:900px;margin:0 auto;display:flex;align-items:center;gap:12px}
.bar .c{flex:1;font-size:13px;color:var(--muted);line-height:1.4}.bar .c b{color:#fff}
.btn{border:0;border-radius:14px;padding:14px 18px;font:700 15px Inter,sans-serif;cursor:pointer;background:#fff;color:var(--deep);white-space:nowrap}
.btn:disabled{opacity:.5}
.err{color:#ff8b8b;font-size:14px;margin-top:8px;min-height:18px}
.ok{text-align:center;padding:40px 10px}
.ok .ic{width:70px;height:70px;border-radius:50%;margin:0 auto 18px;display:grid;place-items:center;background:linear-gradient(150deg,var(--accent),var(--deep))}
.ok p{color:var(--muted);line-height:1.55;margin-top:10px}
.empty{text-align:center;color:var(--muted);padding:40px 10px}
.foot{text-align:center;color:#5f8580;font-size:12px;margin-top:26px}
.full{position:fixed;inset:0;background:rgba(0,0,0,.92);display:none;align-items:center;justify-content:center;z-index:50;padding:16px}
.full img{max-width:100%;max-height:100%;border-radius:12px}
.full.show{display:flex}
</style>
</head>
<body>
<div class="wrap" id="app"><div class="empty">Chargement...</div></div>
<div class="bar" id="bar" style="display:none"><div class="bar-in"><div class="c" id="barC"></div><button class="btn" id="barB"></button></div></div>
<div class="full" id="full" onclick="this.classList.remove('show')"><img id="fullImg" alt=""></div>
<input type="file" id="files" accept="image/*" multiple style="display:none" onchange="ajouter(this.files);this.value=''">
<script>
var SUPABASE_URL = 'https://lzxvktkryxizclkdetaa.supabase.co';
var SUPABASE_KEY = 'sb_publishable_L4Udla2VCbZsNjdm9IRuJw_ExshPrPc';
var S = { tok: '', b: null, step: 1, picks: {}, notes: {}, mine: [], ref: null, sent: false, nom: '', msg: '', busy: false }, sb;
var heart = '<svg viewBox="0 0 24 24"><path d="M12 20s-7-4.4-7-10a4 4 0 0 1 7-2.6A4 4 0 0 1 19 10c0 5.6-7 10-7 10z" stroke-linejoin="round"/></svg>';
var plus = '<svg width="26" height="26" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"><path d="M12 5v14M5 12h14"/></svg>';
function esc(s){ return String(s == null ? '' : s).replace(/[&<>"']/g, function(c){ return { '&': '&amp;', '<': '&lt;', '>': '&gt;', '"': '&quot;', "'": '&#39;' }[c]; }); }
function henzoImgs(){ return (S.b.images || []).filter(function(i){ return !i.mine; }); }
function imgById(id){ return (S.b.images || []).filter(function(i){ return i.id === id; })[0]; }
async function init(){
  S.tok = new URLSearchParams(location.search).get('t') || '';
  try { S.nom = localStorage.getItem('mb_nom') || ''; } catch(e){}
  try {
    sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    var r = await sb.rpc('mood_public', { p_token: S.tok });
    if(r.error || !r.data){ document.getElementById('app').innerHTML = '<div class="empty">Ce lien n\'est plus actif. Demandez un nouveau lien à Henzo Studio.</div>'; return; }
    S.b = r.data;
    (S.b.images || []).forEach(function(i){
      if(i.mine) S.mine.push({ id: i.id, url: i.url, note: i.cnote || '', ref: i.ref });
      else if(i.pick){ S.picks[i.id] = true; if(i.cnote) S.notes[i.id] = i.cnote; }
    });
  } catch(e){ document.getElementById('app').innerHTML = '<div class="empty">Impossible de charger. Vérifiez votre connexion.</div>'; return; }
  render();
}
function go(n){ S.step = n; render(); window.scrollTo({ top: 0, behavior: 'smooth' }); }
function render(){
  if(S.sent) return renderOk();
  var b = S.b, np = Object.keys(S.picks).length, nm = S.mine.length;
  var h = '<div class="brand">Henzo Studio</div><h1>' + esc(b.title || 'Préparons votre séance') + '</h1>' +
    '<p class="intro">' + (b.type ? esc(b.type) + '. ' : '') + (b.notes ? esc(b.notes) : 'Dites-moi ce que vous aimez pour que votre séance vous ressemble.') + '</p>' +
    '<div class="steps"><button class="' + (S.step === 1 ? 'on' : '') + '" onclick="go(1)"><b>' + np + '</b>1. Coups de cœur</button>' +
    '<button class="' + (S.step === 2 ? 'on' : '') + '" onclick="go(2)"><b>' + nm + '</b>2. Mes idées</button>' +
    '<button class="' + (S.step === 3 ? 'on' : '') + '" onclick="go(3)"><b>' + (np + nm ? '✓' : '-') + '</b>3. Envoyer</button></div>';
  if(S.step === 1) h += step1(); else if(S.step === 2) h += step2(); else h += step3();
  h += '<div class="foot">Henzo Studio · Ahougnansou, en face du Restaurant Le Rosier · Bouaké</div>';
  document.getElementById('app').innerHTML = h;
  bar();
}
function step1(){
  var imgs = henzoImgs();
  var h = '<h2>Les photos qui vous plaisent</h2><p class="sub">Touchez le cœur. Ajoutez un mot si vous voulez (« même pose mais assise », « j\'aime ces couleurs »). Vous pouvez aussi proposer votre propre photo à côté.</p>';
  if(!imgs.length) return h + '<div class="empty">Henzo n\'a pas encore ajouté de photos. Passez à l\'étape 2 pour proposer les vôtres.</div>';
  return h + '<div class="grid">' + imgs.map(function(i){ var on = !!S.picks[i.id];
    return '<div class="t' + (on ? ' on' : '') + '"><img class="ph" src="' + esc(i.url) + '" loading="lazy" alt="" onclick="zoom(\'' + esc(i.url) + '\')"><button class="h" onclick="pick(' + i.id + ')" aria-label="J\'aime">' + heart + '</button>' +
      (on ? '<div class="tb"><input placeholder="Un mot sur cette photo ?" value="' + esc(S.notes[i.id] || '') + '" oninput="S.notes[' + i.id + ']=this.value"><button class="var" onclick="variante(' + i.id + ')">+ Proposer ma version / une variante</button></div>' : '') + '</div>'; }).join('') + '</div>';
}
function step2(){
  var h = '<h2>Vos idées et vos photos</h2><p class="sub">Ajoutez vos inspirations : captures Pinterest ou Instagram, photo de votre tenue, d\'un décor, d\'une coiffure... Expliquez en un mot ce que vous voulez.</p>' +
    (S.ref && imgById(S.ref) ? '<div class="ref" style="padding:0 0 10px"><img src="' + esc(imgById(S.ref).url) + '" alt=""> Votre prochaine photo sera une variante de celle-ci <a href="#" style="color:var(--light);margin-left:6px" onclick="S.ref=null;render();return false">annuler</a></div>' : '') +
    '<div class="drop" onclick="document.getElementById(\'files\').click()"><div class="ic">' + plus + '</div><b>Ajouter mes photos</b><span>Depuis votre galerie, plusieurs à la fois</span></div><div class="prog" id="prog"></div>';
  if(S.mine.length) h += '<div class="grid">' + S.mine.map(function(m, k){ var r = m.ref && imgById(m.ref);
    return '<div class="t mine"><img class="ph" src="' + esc(m.url) + '" loading="lazy" alt="" onclick="zoom(\'' + esc(m.url) + '\')"><button class="x" onclick="retirer(' + k + ')" aria-label="Retirer">×</button>' +
      (r ? '<div class="ref"><img src="' + esc(r.url) + '" alt=""> variante de cette photo</div>' : '') +
      '<div class="tb"><input placeholder="Qu\'est-ce que vous aimez ici ?" value="' + esc(m.note) + '" oninput="S.mine[' + k + '].note=this.value" onchange="noter(' + k + ')"></div></div>'; }).join('') + '</div>';
  return h;
}
function step3(){
  var np = Object.keys(S.picks).length, nm = S.mine.length;
  var mini = Object.keys(S.picks).map(function(id){ var i = imgById(Number(id)); return i ? '<img src="' + esc(i.url) + '" alt="">' : ''; }).join('') + S.mine.map(function(m){ return '<img class="v" src="' + esc(m.url) + '" alt="">'; }).join('');
  return '<h2>Tout est prêt ?</h2><p class="sub">Vérifiez puis envoyez. Vous pourrez revenir sur ce lien pour modifier.</p>' +
    '<div class="sum"><div><b>' + np + '</b><span>coup' + (np > 1 ? 's' : '') + ' de cœur</span></div><div><b>' + nm + '</b><span>photo' + (nm > 1 ? 's' : '') + ' ajoutée' + (nm > 1 ? 's' : '') + '</span></div></div>' +
    (mini ? '<div class="mini">' + mini + '</div>' : '') +
    '<label>Votre prénom</label><input class="f" value="' + esc(S.nom) + '" oninput="S.nom=this.value" autocomplete="given-name">' +
    '<label>Un message pour Henzo ? (facultatif)</label><textarea rows="4" oninput="S.msg=this.value" placeholder="Couleurs de tenue, nombre de personnes, ce que vous voulez absolument...">' + esc(S.msg) + '</textarea>' +
    '<div class="err" id="err"></div>';
}
function bar(){
  var np = Object.keys(S.picks).length, nm = S.mine.length, c = document.getElementById('barC'), b = document.getElementById('barB');
  document.getElementById('bar').style.display = S.sent ? 'none' : '';
  c.innerHTML = '<b>' + np + '</b> coup' + (np > 1 ? 's' : '') + ' de cœur · <b>' + nm + '</b> idée' + (nm > 1 ? 's' : '');
  if(S.step === 1){ b.textContent = 'Suivant : mes idées'; b.onclick = function(){ go(2); }; b.disabled = false; }
  else if(S.step === 2){ b.textContent = 'Suivant : envoyer'; b.onclick = function(){ go(3); }; b.disabled = S.busy; }
  else { b.textContent = S.busy ? 'Envoi...' : 'Envoyer à Henzo'; b.onclick = envoyer; b.disabled = S.busy; }
}
function pick(id){ if(S.picks[id]) delete S.picks[id]; else S.picks[id] = true; var y = window.scrollY; render(); window.scrollTo(0, y); }
function variante(id){ S.ref = id; S.picks[id] = true; S.step = 2; render(); window.scrollTo({ top: 0 }); setTimeout(function(){ document.getElementById('files').click(); }, 150); }
function zoom(u){ document.getElementById('fullImg').src = u; document.getElementById('full').classList.add('show'); }
function compress(file){
  return new Promise(function(ok, ko){
    var url = URL.createObjectURL(file), img = new Image();
    img.onload = function(){ var r = Math.min(1, 1600 / Math.max(img.width, img.height)), c = document.createElement('canvas');
      c.width = Math.round(img.width * r); c.height = Math.round(img.height * r); c.getContext('2d').drawImage(img, 0, 0, c.width, c.height);
      URL.revokeObjectURL(url); c.toBlob(function(b){ b ? ok(b) : ko(new Error('Image illisible')); }, 'image/jpeg', 0.84); };
    img.onerror = function(){ URL.revokeObjectURL(url); ko(new Error('Image illisible')); };
    img.src = url;
  });
}
async function ajouter(files){
  files = Array.prototype.slice.call(files || []); if(!files.length) return;
  S.busy = true; bar();
  var ok = 0;
  for(var k = 0; k < files.length; k++){
    var p = document.getElementById('prog'); if(p) p.textContent = 'Envoi de la photo ' + (k + 1) + ' sur ' + files.length + '...';
    try {
      var blob = await compress(files[k]);
      var path = 'client/' + S.tok + '/' + Date.now() + '-' + Math.random().toString(36).slice(2, 8) + '.jpg';
      var up = await sb.storage.from('moodboard').upload(path, blob, { contentType: 'image/jpeg' });
      if(up.error) throw up.error;
      var r = await sb.rpc('mood_ajouter_image', { p_token: S.tok, p_path: path, p_note: '', p_nom: S.nom, p_ref: S.ref });
      if(r.error) throw r.error;
      S.mine.push({ id: r.data.id, url: r.data.url, note: '', ref: S.ref }); S.ref = null; ok++;
    } catch(e){ console.warn(e); }
  }
  S.busy = false; render();
  var p2 = document.getElementById('prog'); if(p2) p2.textContent = ok === files.length ? '' : (files.length - ok) + ' photo(s) n\'ont pas pu être envoyées, réessayez.';
}
async function retirer(k){
  var m = S.mine[k]; if(!m || !confirm('Retirer cette photo ?')) return;
  try { await sb.rpc('mood_retirer_image', { p_token: S.tok, p_id: m.id }); } catch(e){}
  try { await fetch(SUPABASE_URL + '/functions/v1/mood-clean', { method: 'POST', headers: { 'Content-Type': 'application/json', apikey: SUPABASE_KEY }, body: JSON.stringify({ token: S.tok, ids: [m.id] }) }); } catch(e){}
  S.mine.splice(k, 1); render();
}
async function noter(k){ var m = S.mine[k]; if(m) try { await sb.rpc('mood_note_image', { p_token: S.tok, p_id: m.id, p_note: m.note }); } catch(e){} }
async function envoyer(){
  var ids = Object.keys(S.picks), err = document.getElementById('err'); if(err) err.textContent = '';
  if(!ids.length && !S.mine.length && !S.msg.trim()){ if(err) err.textContent = 'Choisissez au moins une photo, ajoutez une idée ou écrivez un message.'; return; }
  S.busy = true; bar();
  try {
    for(var k = 0; k < S.mine.length; k++) await noter(k);
    var r = await sb.rpc('mood_choisir', { p_token: S.tok, p_picks: ids.map(function(id){ return { id: Number(id), note: (S.notes[id] || '').trim() }; }), p_nom: S.nom.trim(), p_message: S.msg.trim() });
    if(r.error) throw new Error(r.error.message);
    try { localStorage.setItem('mb_nom', S.nom.trim()); } catch(e){}
    S.sent = true; S.busy = false; render();
  } catch(e){ S.busy = false; bar(); var er = document.getElementById('err'); if(er) er.textContent = 'Erreur, réessayez.'; }
}
function renderOk(){
  var np = Object.keys(S.picks).length, nm = S.mine.length;
  var msg = 'Bonjour Henzo Studio, je viens d\'envoyer mes idées pour la séance (' + np + ' coup' + (np > 1 ? 's' : '') + ' de cœur, ' + nm + ' photo' + (nm > 1 ? 's' : '') + ' ajoutée' + (nm > 1 ? 's' : '') + ').' + (S.msg ? '\n' + S.msg : '');
  document.getElementById('app').innerHTML = '<div class="ok"><div class="ic"><svg width="32" height="32" viewBox="0 0 24 24" fill="none" stroke="#fff" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"><path d="M5 12.5l4.5 4.5L19 7.5"/></svg></div>' +
    '<h1>Merci' + (S.nom ? ' ' + esc(S.nom.split(' ')[0]) : '') + ' !</h1><p>Henzo a bien reçu vos ' + (np + nm) + ' idée' + (np + nm > 1 ? 's' : '') + '. Il prépare votre séance avec. Vous pouvez revenir sur ce lien pour ajouter ou changer quelque chose.</p>' +
    (S.b.phone ? '<a class="btn" style="display:inline-block;margin-top:18px;text-decoration:none" href="https://wa.me/' + esc(S.b.phone) + '?text=' + encodeURIComponent(msg) + '" target="_blank">Prévenir Henzo sur WhatsApp</a>' : '') +
    '<p><a href="#" style="color:var(--light)" onclick="S.sent=false;S.step=1;render();return false">Modifier mes choix</a></p></div>';
  document.getElementById('bar').style.display = 'none';
}
init();
</script>
</body>
</html>

<style>

.ps{font-size:8pt;color:#7d8f8c;font-style:italic}

.pk.rows .cd li{break-inside:avoid}
.pk.rows .cp{margin-bottom:0}
.pk.rows .cd .tg{left:5mm}

.pg.airy .po{margin-top:10mm}.pg.airy .pc{margin-top:8mm;padding:6mm}.pg.airy .po-l span{font-size:8.8pt;padding:1.8mm 3.4mm}

.pg.airy1 .pt{margin:12mm 0 8mm}.pg.airy1 .pt h1{font-size:26pt}.pg.airy1 .pk{gap:6mm}.pg.airy1 .cd{padding:6mm 5.5mm 5mm}.pg.airy1 .cn{font-size:11.5pt}

.pc{display:flex;gap:6mm;margin-top:6mm;padding:4.5mm 5mm;border-radius:3mm;background:#f5faf9;border:.5pt solid #e1eeeb}

.pf{margin-top:auto;padding-top:3.5mm;border-top:.5pt solid #e1eeeb;display:flex;justify-content:center;flex-wrap:wrap;gap:1mm 6mm;font-size:7.8pt;color:#5d6f6c}

.pg.dense{font-size:8pt}.pg.dense .pt{margin:6mm 0 5mm}.pg.dense .cd li{font-size:7.9pt;padding:.45mm 0}.pg.dense .cp{font-size:16pt;margin-bottom:2.4mm}.pg.dense .po{margin-top:5mm}.pg.dense .pc{margin-top:4.5mm}
.pg.denser .cd li{font-size:7.3pt;padding:.25mm 0;line-height:1.3}.pg.denser .cd{padding:4mm 3.5mm 3mm}.pg.denser .pk{gap:4mm}
.prv{margin-top:5mm;padding-top:3mm;border-top:.5pt solid #e1eeeb}

.prv p i{font-style:normal;display:inline-block;width:3.8mm;height:3.8mm;line-height:3.8mm;text-align:center;border-radius:50%;background:var(--pacc,#48A89A);color:#fff;font-size:6.5pt;font-weight:700;margin:0 1.2mm 0 2.6mm;vertical-align:.2mm}
.prv p i:first-child{margin-left:0}
.prv p b{color:var(--pdeep,#00524D);font-weight:600}
/* Page de garde */
.cv{justify-content:space-between}
.cv-top{text-align:center;padding-top:30mm}
.cv-top .pm{font-size:15pt;letter-spacing:.5em;margin-right:-.5em}
.cv-top .ps{font-size:10.5pt;margin-top:4mm}
.cv-line{width:22mm;height:0;border-top:.8pt solid var(--pacc,#48A89A);margin:9mm auto 0}
.cv-mid{padding:0 14mm}

.cv-l .n{flex:1;min-width:0}
.cv-l .n b{display:block;font-size:12.5pt;font-weight:700;color:var(--pink,#053931)}
.cv-l .n span{display:block;font-size:8.6pt;color:#7d8f8c;margin-top:.8mm}
.cv-l em{font-style:normal;font-size:8.6pt;color:#5d6f6c;white-space:nowrap}
.cv-l em b{font-size:11pt;color:var(--pdeep,#00524D);font-weight:800;margin-left:1mm}
.cv .pf{margin-top:0}
/* Apercu du PDF a l'ecran (?pdf=1) */
body.pdfmode{background:#e9eeed;padding:0}
body.pdfmode #app,body.pdfmode .bar{display:none !important}
body.pdfmode #pdf{position:static;left:auto}
body.pdfmode .pg{box-sizing:content-box;padding:12mm;margin:8mm auto;box-shadow:0 4px 24px rgba(0,0,0,.12)}
.pdfbar{position:sticky;top:0;z-index:5;display:flex;justify-content:center;gap:10px;padding:10px;background:rgba(255,255,255,.92);border-bottom:1px solid #d6e2e0}
.pdfbar button{border:0;border-radius:12px;padding:10px 16px;font:700 14px Inter,sans-serif;cursor:pointer;background:var(--pdeep,#00524D);color:#fff}
.pdfbar button + button{background:#fff;color:var(--pdeep,#00524D);border:1px solid #cfe0dc}
@page{size:A4;margin:12mm}
@media print{
  html,body{background:#fff !important;padding:0 !important;margin:0}
  #app,.bar,.pdfbar{display:none !important}
  #pdf{position:static;left:auto}
  body.pdfmode .pg{padding:0;margin:0;box-shadow:none}
}
</style>

async function init(){
  var q = new URLSearchParams(location.search);
  S.slug = (q.get('s') || 'henzo').toLowerCase();
  S.par = (q.get('p') || '').toUpperCase().replace(/[^A-Z0-9-]/g, '').slice(0, 30);
  var cslug = (q.get('c') || '').toLowerCase(), app = document.getElementById('app');
  try {
    var sb = window.supabase.createClient(SUPABASE_URL, SUPABASE_KEY);
    var p = await sb.from('tarif_page').select('*').eq('slug', S.slug).maybeSingle();
    if(!p.data){ app.innerHTML = '<div class="empty">Cette page de tarifs n\'existe pas.</div>'; return; }
    S.page = p.data;
    if(window.appliquerApparencePage) try { appliquerApparencePage(p.data.apparence); } catch(e){}
    var r = await Promise.all([
      sb.from('tarifs').select('*').eq('user_id', p.data.user_id).not('public', 'is', false).not('active', 'is', false).order('position', { ascending: true }),
      sb.from('tarif_collections').select('*').eq('user_id', p.data.user_id).order('position', { ascending: true })
    ]);
    // Seulement ce qui est propose et visible (vide = oui, comme dans l'app)
    var rows = (r[0].data || []).filter(function(x){ return x.public !== false && x.active !== false; }).sort(byPos);
    var cols = ((r[1] && r[1].data) || []).filter(function(c){ return c.public !== false && c.actif !== false; }).sort(byPos);
    S.opts = rows.filter(function(x){ return x.kind === 'option'; });
    var f = rows.filter(function(x){ return (x.kind || 'formule') === 'formule'; });
    if(cols.length){
      S.cols = cols;
      S.packs = f.filter(function(t){ return cols.some(function(c){ return c.id === t.collection_id; }); });
    } else {
      // Ancienne grille sans collections : une seule liste
      S.legacy = true;
      S.cols = [{ id: 0, nom: S.page.title || 'Nos formules', slug: '', options: S.opts.map(function(o){ return o.id; }), acompte: 0 }];
      S.packs = f;
    }
  } catch(e){ app.innerHTML = '<div class="empty">Impossible de charger les tarifs. Vérifiez votre connexion.</div>'; return; }
  var c = cslug ? S.cols.filter(function(x){ return String(x.slug || '').toLowerCase() === cslug; })[0] : null;
  if(c){ S.only = true; S.cur = c.id; } else S.cur = S.cols.length > 1 ? S.cols[0].id : (S.cols[0] || {}).id;
  document.title = c ? c.nom + ' - ' + brand() : (S.page.title || 'Tarifs - ' + brand());
  render();
  if(q.get('pdf') === '1') openPdf(true);
}

// Si une page deborde, on resserre un peu le texte
function fit(){
  document.querySelectorAll('#pdf .pg').forEach(function(pg){
    if(pg.classList.contains('cv')) return;
    pg.classList.remove('dense', 'denser', 'airy', 'airy1');
    var over = function(){ return pg.scrollHeight > pg.clientHeight + 1; };
    // Place libre entre le dernier bloc et le pied de page
    var free = function(){ var f = pg.querySelector('.pf'), b = f && f.previousElementSibling; return f && b ? f.offsetTop - (b.offsetTop + b.offsetHeight) : 0; };
    // Pas de place pour "Comment reserver" : on l'enleve avant de serrer le texte
    var prv = pg.querySelector('.prv');
    if(over() && prv) prv.remove();
    if(over()){ pg.classList.add('dense'); if(over()) pg.classList.add('denser'); return; }
    ['airy', 'airy1'].some(function(k){
      if(free() < pg.clientHeight * 0.06) return true;
      pg.classList.add(k);
      if(!over() && free() >= 24) return true;
      pg.classList.remove(k); return false;
    });
  });
}
function openPdf(auto){
  if(!S.only && !auto && S.cur !== 'all' && S.cols.length > 1) S.pdfOne = S.cur; else S.pdfOne = null;
  document.body.classList.add('pdfmode');
  buildPdf(); window.scrollTo(0, 0);
  var go = function(){ fit(); setTimeout(function(){ window.print(); }, 300); };
  if(document.fonts && document.fonts.ready) document.fonts.ready.then(go); else setTimeout(go, 600);
}
function closePdf(){ document.body.classList.remove('pdfmode'); document.getElementById('pdf').innerHTML = ''; render(); }
init();
</script>
